name: Build PyTorch + TorchVision for macOS x86_64

on:
  workflow_dispatch:

env:
  MAX_JOBS: 8

jobs:
  pytorch_tag:
    runs-on: ubuntu-latest
    outputs:
      pytorch_tag: ${{ steps.get-tag.outputs.pytorch_tag }}
      torchvision_tag: ${{ steps.get-tag.outputs.torchvision_tag }}
    steps:
      - id: get-tag
        run: |
          PYTORCH_LATEST_TAG=$(gh release -R "pytorch/pytorch" list --limit 1 --json tagName -q ".[0].tagName" || echo "")
          if [ -z "$PYTORCH_LATEST_TAG" ] || [ "$PYTORCH_LATEST_TAG" = "null" ]; then
            echo "Failed to fetch latest PyTorch tag from GitHub API. Exiting ..."
            exit 1
          fi
          echo "pytorch_tag=$PYTORCH_LATEST_TAG" >> $GITHUB_OUTPUT

          TORCHVISION_LATEST_TAG=$(gh release -R "pytorch/vision" list --limit 1 --json tagName -q ".[0].tagName" || echo "")
          if [ -z "$TORCHVISION_LATEST_TAG" ] || [ "$TORCHVISION_LATEST_TAG" = "null" ]; then
            echo "Failed to fetch latest TorchVision tag from GitHub API. Exiting ..."
            exit 1
          fi
          echo "torchvision_tag=$TORCHVISION_LATEST_TAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: pytorch_tag
    runs-on: macos-15-intel
    strategy:
      matrix:
        python-version: ["3.11"]
      fail-fast: false

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          brew install cmake ninja

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel delocate
          python -m pip install -r requirements.txt
          python -m pip install pillow numpy

      - name: Install Intel oneAPI Base Toolkit (MKL) on macOS Intel
        run: |
          echo "Downloading Intel oneAPI BaseKit..."
          curl -L -o basekit.dmg "https://registrationcenter-download.intel.com/akdlm/IRC_NAS/cd013e6c-49c4-488b-8b86-25df6693a9b7/m_BaseKit_p_2023.2.0.49398.dmg"

          echo "Mounting DMG..."
          hdiutil attach basekit.dmg -nobrowse -quiet

          echo "Installing silently (only MKL component)..."
          sudo /Volumes/m_BaseKit_p_2023.2.0.49398/bootstrapper.app/Contents/MacOS/bootstrapper \
            -s \
            --action install \
            --eula=accept \
            --components="intel.oneapi.mac.mkl.devel:intel.oneapi.mac.openmp" \
            --log-dir=/tmp/oneapi_install_log
          sudo chown -R $(whoami) /opt/intel

          echo "Unmounting DMG..."
          hdiutil detach /Volumes/m_BaseKit_p_2023.2.0.49398 -quiet || true

      - name: Set build environment variables
        run: |
          source /opt/intel/oneapi/setvars.sh
          find /opt/intel/oneapi -type f

          cat << EOF >> $GITHUB_ENV
          MACOSX_DEPLOYMENT_TARGET=14.0
          DEBUG=0
          BUILD_TEST=0
          BUILD_TYPE=Release
          INSTALL_TEST=0
          USE_CUDA=OFF
          USE_CUDNN=OFF
          USE_ROCM=OFF
          USE_MPS=ON
          USE_MKL=ON
          USE_MKLDNN=ON
          USE_OPENMP=ON
          USE_NNPACK=ON
          USE_FBGEMM=ON
          USE_QNNPACK=ON
          USE_PYTORCH_QNNPACK=ON
          USE_XNNPACK=ON
          USE_COREML_DELEGATE=ON
          USE_PYTORCH_METAL_EXPORT=ON
          USE_MPI=OFF
          USE_NCCL=OFF
          USE_GFLAGS=OFF
          USE_GLOG=OFF
          USE_EXCEPTION_PTR=ON
          ATEN_CPU_CAPABILITY=avx512
          ONEAPI_ROOT=/opt/intel/oneapi
          MKLROOT=/opt/intel/oneapi/mkl/latest
          MKL_USE_STATIC=ON
          MKL_LINK_STATIC=ON
          OpenMP_ROOT=${LIBOMP_DIR}
          CMAKE_BUILD_RPATH_USE_ORIGIN=ON
          CMAKE_INSTALL_RPATH_USE_LINK_PATH=OFF
          CMAKE_SKIP_BUILD_RPATH=FALSE
          CMAKE_BUILD_WITH_INSTALL_RPATH=FALSE
          CMAKE_MACOSX_RPATH=TRUE
          CMAKE_BUILD_PARALLEL_LEVEL=${{ env.MAX_JOBS }}
          MAX_JOBS=${{ env.MAX_JOBS }}
          EOF

      - name: Download from another workflow run
        uses: actions/download-artifact@v4
        with:
          run-id: 24393307889
          artifact-ids: 6430987072
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build PyTorch
        run: |
          find . -type f

          echo "found the following wheels:"
          find . -name "*.whl"
          echo "running delocate"
          DYLD_LIBRARY_PATH=/opt/intel/oneapi/mkl/2023.2.0/lib:/opt/intel/oneapi/compiler/2023.2.0/mac/compiler/lib
          find . -name "*.whl" | xargs -I {} delocate-wheel -v {}
          find . -name "*.whl"
          find . -name "*.whl" | xargs -I {} delocate-listdeps {}
          echo "Finished delocating wheels at $(date)"

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pytorch-macos-x86_64-py${{ matrix.python-version }}
          path: |
            *.whl
          retention-days: 1
          if-no-files-found: error
