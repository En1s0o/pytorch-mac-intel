name: Build PyTorch + TorchVision for macOS x86_64

on:
  workflow_dispatch:

env:
  MAX_JOBS: 8

jobs:
  pytorch_tag:
    runs-on: ubuntu-latest
    outputs:
      pytorch_tag: ${{ steps.get-tag.outputs.pytorch_tag }}
      torchvision_tag: ${{ steps.get-tag.outputs.torchvision_tag }}
    steps:
      - id: get-tag
        run: |
          PYTORCH_LATEST_TAG=$(gh release -R "pytorch/pytorch" list --limit 1 --json tagName -q ".[0].tagName" || echo "")
          if [ -z "$PYTORCH_LATEST_TAG" ] || [ "$PYTORCH_LATEST_TAG" = "null" ]; then
            echo "Failed to fetch latest PyTorch tag from GitHub API. Exiting ..."
            exit 1
          fi
          echo "pytorch_tag=$PYTORCH_LATEST_TAG" >> $GITHUB_OUTPUT

          TORCHVISION_LATEST_TAG=$(gh release -R "pytorch/vision" list --limit 1 --json tagName -q ".[0].tagName" || echo "")
          if [ -z "$TORCHVISION_LATEST_TAG" ] || [ "$TORCHVISION_LATEST_TAG" = "null" ]; then
            echo "Failed to fetch latest TorchVision tag from GitHub API. Exiting ..."
            exit 1
          fi
          echo "torchvision_tag=$TORCHVISION_LATEST_TAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: pytorch_tag
    runs-on: macos-15-intel
    strategy:
      matrix:
        #python-version: ["3.10", "3.11", "3.12", "3.13"]
        python-version: ["3.11"]
      fail-fast: false

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout PyTorch source
        uses: actions/checkout@v4
        with:
          repository: pytorch/pytorch
          ref: ${{ needs.pytorch_tag.outputs.pytorch_tag }}
          path: pytorch
          submodules: recursive
          fetch-depth: 1

      - name: Checkout TorchVision source
        uses: actions/checkout@v4
        with:
          repository: pytorch/vision
          ref: ${{ needs.pytorch_tag.outputs.torchvision_tag }}
          path: vision
          submodules: recursive
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          brew install cmake ninja

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r pytorch/requirements.txt
          python -m pip install mkl-static mkl-include pillow numpy

      - name: Set build environment variables
        run: |
          cat << EOF >> $GITHUB_ENV
          MACOSX_DEPLOYMENT_TARGET=14.0
          ATEN_CPU_CAPABILITY=avx2
          USE_NATIVE_ARCH=0
          DEBUG=0
          BUILD_TEST=0
          BUILD_TYPE=Release
          USE_MPS=1
          USE_CUDA=0
          USE_CUDNN=0
          USE_ROCM=0
          USE_MKL=1
          USE_MKLDNN=1
          USE_OPENMP=1
          USE_DISTRIBUTED=1
          USE_GLOO=1
          USE_NCCL=0
          USE_FBGEMM=1
          USE_QNNPACK=0
          USE_XNNPACK=1
          MAX_JOBS=${{ env.MAX_JOBS }}
          CMAKE_BUILD_PARALLEL_LEVEL=${{ env.MAX_JOBS }}
          EOF

      - name: Build PyTorch
        working-directory: ./pytorch
        run: |
          python setup.py bdist_wheel --plat-name=macosx_14_0_x86_64
          python -m pip install dist/torch-*.whl --force-reinstall --no-deps

      - name: Build TorchVision
        working-directory: ./vision
        run: |
          python setup.py bdist_wheel --plat-name=macosx_14_0_x86_64
          python -m pip install dist/torchvision-*.whl --force-reinstall --no-deps

      - name: Verify installation
        run: |
          python -c "
          import platform
          import torch
          import torchvision
          print('Python version:', platform.python_version())
          print('Torch version:', torch.__version__)
          print('TorchVision version:', torchvision.__version__)
          print('CUDA available:', torch.cuda.is_available())
          print('MPS available:', torch.backends.mps.is_available())
          print('Build successful!')
          "

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pytorch-macos-x86_64-py${{ matrix.python-version }}
          path: |
            pytorch/dist/*.whl
            vision/dist/*.whl
          retention-days: 30
          if-no-files-found: error

  release:
    needs:
      - pytorch_tag
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: pytorch-*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pytorch-${{ needs.pytorch_tag.outputs.pytorch_tag }}-torchvision-${{ needs.pytorch_tag.outputs.torchvision_tag }}-macos-x86_64
          name: PyTorch ${{ needs.pytorch_tag.outputs.pytorch_tag }} + TorchVision ${{ needs.pytorch_tag.outputs.torchvision_tag }} for macOS x86_64
          body: |
            Custom macOS x86_64 build of PyTorch ${{ needs.pytorch_tag.outputs.pytorch_tag }} with TorchVision ${{ needs.pytorch_tag.outputs.torchvision_tag }}.
            - Built for Python 3.10, 3.11, 3.12, 3.13
            - CPU + MKL + MPS
          files: wheels/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
