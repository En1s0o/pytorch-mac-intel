name: Build PyTorch + TorchVision for macOS x86_64

on:
  workflow_dispatch:

env:
  MAX_JOBS: 8

jobs:
  pytorch_tag:
    runs-on: ubuntu-latest
    outputs:
      pytorch_tag: ${{ steps.get-tag.outputs.pytorch_tag }}
      torchvision_tag: ${{ steps.get-tag.outputs.torchvision_tag }}
    steps:
      - id: get-tag
        run: |
          PYTORCH_LATEST_TAG=$(gh release -R "pytorch/pytorch" list --limit 1 --json tagName -q ".[0].tagName" || echo "")
          if [ -z "$PYTORCH_LATEST_TAG" ] || [ "$PYTORCH_LATEST_TAG" = "null" ]; then
            echo "Failed to fetch latest PyTorch tag from GitHub API. Exiting ..."
            exit 1
          fi
          echo "pytorch_tag=$PYTORCH_LATEST_TAG" >> $GITHUB_OUTPUT

          TORCHVISION_LATEST_TAG=$(gh release -R "pytorch/vision" list --limit 1 --json tagName -q ".[0].tagName" || echo "")
          if [ -z "$TORCHVISION_LATEST_TAG" ] || [ "$TORCHVISION_LATEST_TAG" = "null" ]; then
            echo "Failed to fetch latest TorchVision tag from GitHub API. Exiting ..."
            exit 1
          fi
          echo "torchvision_tag=$TORCHVISION_LATEST_TAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: pytorch_tag
    runs-on: macos-15-intel
    strategy:
      matrix:
        #python-version: ["3.10", "3.11", "3.12", "3.13"]
        python-version: ["3.11"]
      fail-fast: false

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout PyTorch source
        uses: actions/checkout@v4
        with:
          repository: pytorch/pytorch
          ref: ${{ needs.pytorch_tag.outputs.pytorch_tag }}
          path: pytorch
          submodules: recursive
          fetch-depth: 1

      - name: Checkout TorchVision source
        uses: actions/checkout@v4
        with:
          repository: pytorch/vision
          ref: ${{ needs.pytorch_tag.outputs.torchvision_tag }}
          path: vision
          submodules: recursive
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          brew install cmake ninja libomp

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r pytorch/requirements.txt
          python -m pip install mkl-static mkl-include pillow numpy

      - name: Install Intel oneAPI Base Toolkit (MKL) on macOS Intel
        run: |
          echo "Downloading Intel oneAPI BaseKit..."
          curl -L -o basekit.dmg "https://registrationcenter-download.intel.com/akdlm/IRC_NAS/cd013e6c-49c4-488b-8b86-25df6693a9b7/m_BaseKit_p_2023.2.0.49398.dmg"

          echo "Mounting DMG..."
          hdiutil attach basekit.dmg -nobrowse -quiet

          echo "Installing silently (only MKL component)..."
          sudo /Volumes/m_BaseKit_p_2023.2.0.49398/bootstrapper.app/Contents/MacOS/bootstrapper \
            -s \
            --action install \
            --eula=accept \
            --components="intel.oneapi.mac.mkl.devel" \
            --continue-with-optional-error=yes \
            --log-dir=/tmp/oneapi_install_log

          echo "Unmounting DMG..."
          hdiutil detach /Volumes/m_BaseKit_p_2023.2.0.49398 -quiet || true

      - name: Set build environment variables
        run: |
          source /opt/intel/oneapi/setvars.sh
          LIBOMP_DIR=$(brew --prefix libomp)

          cat << EOF >> $GITHUB_ENV
          MKLROOT=/opt/intel/oneapi/mkl/latest
          MKL_ROOT=/opt/intel/oneapi/mkl/latest
          ONEAPI_ROOT=/opt/intel/oneapi
          MACOSX_DEPLOYMENT_TARGET=14.0
          DEBUG=0
          BUILD_TEST=0
          BUILD_TYPE=Release
          USE_CUDA=OFF
          USE_CUDNN=OFF
          USE_ROCM=OFF
          USE_MPS=ON
          USE_MKL=ON
          USE_MKLDNN=ON
          USE_OPENMP=ON
          USE_NNPACK=ON
          USE_FBGEMM=ON
          USE_QNNPACK=ON
          USE_PYTORCH_QNNPACK=ON
          USE_XNNPACK=ON
          USE_COREML_DELEGATE=ON
          USE_PYTORCH_METAL_EXPORT=ON
          USE_MPI=OFF
          USE_NCCL=OFF
          USE_GFLAGS=OFF
          USE_GLOG=OFF
          USE_EXCEPTION_PTR=ON
          MAX_JOBS=${{ env.MAX_JOBS }}
          OpenMP_ROOT=${LIBOMP_DIR}
          CMAKE_PREFIX_PATH="${MKLROOT}:${CMAKE_PREFIX_PATH}"
          CMAKE_BUILD_PARALLEL_LEVEL=${{ env.MAX_JOBS }}
          EOF

      - name: Build PyTorch
        working-directory: ./pytorch
        run: |
          python setup.py bdist_wheel --plat-name=macosx_14_0_x86_64
          python -m pip install dist/torch-*.whl --force-reinstall --no-deps

      - name: Build TorchVision
        working-directory: ./vision
        run: |
          python setup.py bdist_wheel --plat-name=macosx_14_0_x86_64
          python -m pip install dist/torchvision-*.whl --force-reinstall --no-deps

      - name: Verify installation
        run: |
          python -c "
          import platform
          import torch
          import torchvision
          print('Python version:', platform.python_version())
          print('Torch version:', torch.__version__)
          print('TorchVision version:', torchvision.__version__)
          print('CUDA available:', torch.cuda.is_available())
          print('MPS available:', torch.backends.mps.is_available())
          print('Build successful!')
          "

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pytorch-macos-x86_64-py${{ matrix.python-version }}
          path: |
            pytorch/dist/*.whl
            vision/dist/*.whl
          retention-days: 30
          if-no-files-found: error

  release:
    needs:
      - pytorch_tag
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: pytorch-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pytorch-${{ needs.pytorch_tag.outputs.pytorch_tag }}-torchvision-${{ needs.pytorch_tag.outputs.torchvision_tag }}-macos-x86_64
          name: PyTorch ${{ needs.pytorch_tag.outputs.pytorch_tag }} + TorchVision ${{ needs.pytorch_tag.outputs.torchvision_tag }} for macOS x86_64
          body: |
            Custom macOS x86_64 build of PyTorch ${{ needs.pytorch_tag.outputs.pytorch_tag }} with TorchVision ${{ needs.pytorch_tag.outputs.torchvision_tag }}.
            - Built for Python 3.10, 3.11, 3.12, 3.13
            - CPU + MKL only (no CUDA/MPS)
          files: wheels/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
