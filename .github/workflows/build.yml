name: Build PyTorch for macOS x86_64

on:
  workflow_dispatch:

env:
  MAX_JOBS: 8

jobs:
  pytorch_tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - id: get-tag
        run: |
          LATEST_TAG=$(gh release -R "pytorch/pytorch" list --limit 1 --json tagName -q ".[0].tagName" || echo "")
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "Failed to fetch latest PyTorch tag from GitHub API. Exiting ..."
            exit 1
          fi
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    runs-on: macos-15-intel
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout PyTorch source
        uses: actions/checkout@v4
        with:
          repository: pytorch/pytorch
          ref: ${{ needs.pytorch_tag.outputs.tag }}
          submodules: recursive
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          brew install cmake ninja

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install mkl-static mkl-include

      - name: Set build environment variables
        run: |
          cat << EOF >> $GITHUB_ENV
          BUILD_TEST=0
          BUILD_TYPE=Release
          DEBUG=0
          USE_MPS=0
          USE_CUDA=0
          USE_ROCM=0
          USE_MKL=1
          USE_MKLDNN=1
          USE_DISTRIBUTED=0
          USE_NATIVE_ARCH=0
          USE_FBGEMM=1
          USE_QNNPACK=0
          USE_XNNPACK=1
          FORCE_CUDA=0
          MAX_JOBS=${{ env.MAX_JOBS }}
          MACOSX_DEPLOYMENT_TARGET=10.15
          CMAKE_BUILD_PARALLEL_LEVEL=${{ env.MAX_JOBS }}
          EOF

      - name: Build PyTorch
        run: |
          python setup.py bdist_wheel --plat-name=macosx_10_15_x86_64

      - name: Verify installation
        run: |
          python -c "
          import platform
          import torch
          print('Python version:', platform.python_version())
          print('Torch version:', torch.__version__)
          print('CUDA available:', torch.cuda.is_available())
          print('MPS available:', torch.backends.mps.is_available())
          print('Build successful!')
          "

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: torch-macos-x86_64-py${{ matrix.python-version }}
          path: |
            dist/*.whl
          retention-days: 30
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: torch-*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: torch-${{ needs.pytorch_tag.outputs.tag }}-macos-x86_64
          name: PyTorch ${{ needs.pytorch_tag.outputs.tag }} for macOS x86_64
          body: |
            Custom macOS x86_64 build of PyTorch ${{ needs.pytorch_tag.outputs.tag }}.
            - Built for Python 3.10, 3.11, 3.12, 3.13
            - CPU + MKL only (no CUDA/MPS)
          files: wheels/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
